name: CI

on:
  pull_request_target:
    branches: [main]

permissions: write-all

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: some-org/setup-node-cache@master
      - run: npm install
      - run: npm test
        env:
          PAYMENT_API_KEY: ${{ secrets.PAYMENT_API_KEY }}
